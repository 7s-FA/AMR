# ========================================================================
# 역할: 도킹·REST 설정 (토픽 이름, 마커 보드, 카메라 보정 경로, 정렬·직진 제어값, IR 핀, 네트워크 인터페이스, rest_control).
# 사용처: docking_standby/docking_node(docking_control), rest_forward, docking_network.py 등.
# ========================================================================
board_file: docking_board.yaml
parking_board_file: parking_board.yaml
parking_control:
  far_steering_gain: 1.0
  near_angular_rps: 0.234
  steering_accel_rps2: 1000.0
  max_final_distance_m: 0.3
  staging_distance_m: 0.3
network:
  host_interface: wlx705dccf1e506
  robot_interface: wlan0
vision:
  preview_enabled: false  # 영상은 로봇 내부 도킹 전용, 외부 HTTP 영상(8085) 안 띄움 (2026-10-08)
  transport: local_shared_memory
  calibration_file: camera.yaml
  http_port: 8085
  preview_fps: 2.0
  preview_jpeg_quality: 70
  image_width: 640
  image_height: 480
gpio_chip: /dev/gpiochip4
gpio_pin: 17
camera_frame: burger2_camera_optical_frame
cmd_topic: /burger2/cmd_vel_direct
motor_state_topic: /burger2/sensor_state
motor_power_service: /burger2/motor_power
odom_topic: /burger2/odom
base_frame: burger2/base_footprint
max_image_age_s: 0.5
control:
  camera_forward_m: 0.0
  camera_left_m: 0.0
  camera_yaw_deg: 0.0
  staging_distance_m: 0.35
  lateral_tolerance_m: 0.005
  yaw_tolerance_deg: 1.0
  aligned_hold_s: 0.7
  align_speed_mps: 0.0351
  final_speed_mps: 0.02808
  angular_speed_scale: 0.7 #변경 1 -> 0.7 (2026-10-06)
  angular_kd: 0.4 #pd 제어 적용
  angular_rate_filter_s: 0.1
  max_angular_rps: 0.234
  near_angular_rps: 0.08 #0.12 -> 0.08 (2026-10-07)
  steering_accel_rps2: 0.8
  far_steering_gain: 1.25
  min_angular_rps: 0.03
  observation_timeout_s: 0.5
  vision_recovery_timeout_s: 2.0
  vision_recovery_hold_s: 0.3
  vision_recovery_fresh_s: 0.25
  max_vision_recoveries: 3
  odom_timeout_s: 0.3
  odom_recovery_enabled: true
  odom_recovery_timeout_s: 4.0  # 엔코더 공백이 2초를 넘겨 도킹 실패해 4초로 늘림 (2026-10-08)
  odom_recovery_hold_s: 0.3
  odom_recovery_fresh_s: 0.15
  max_odom_recoveries: 3
  ir_timeout_s: 0.1
  max_final_distance_m: 0.45
  max_final_time_s: 30.0
  max_total_distance_m: 1.0
  max_total_time_s: 90.0
  max_start_distance_m: 0.9
  min_visual_distance_m: 0.12
  stopped_hold_s: 0.5
rest_control:
  speed_mps: 0.0351
  max_time_s: 90.0
  odom_timeout_s: 0.3
  stopped_hold_s: 0.5
  stop_timeout_s: 3.0